<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f2937"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>ENERGETRA Predračun</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#111827;display:grid;place-items:center;min-height:100vh}.l{font-weight:800;font-size:20px;text-align:center}.s{font-size:13px;color:#667085;margin-top:8px}</style></head><body><div><div class="l">ENERGETRA Predračun</div><div class="s">Učitavanje aplikacije…</div></div><script>(async()=>{try{const names=['./app0.b64','./app1.b64','./app2.b64','./app3.b64','./app4.b64'];const ps=await Promise.all(names.map(n=>fetch(n).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const b64=ps.join('');const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}catch(e){document.body.innerHTML='<div style="padding:24px;font-family:Arial"><b>Greška pri učitavanju.</b><br><br>Osveži stranicu. '+String(e)+'</div>';}})();</script></body></html>
